    .hc-title{font-size:1rem;font-weight:700;color:var(--text);}

  [2043,9,17,'추석 연휴'],[2043,9,18,'추석'],[2043,9,19,'추석 연휴'],
  [2044,10,5,'추석 연휴'],[2044,10,6,'추석'],[2044,10,7,'추석 연휴'],
];

const YEARS = Array.from({length:20},(_,i)=>2025+i);
let currentYear = new Date().getFullYear();
if(currentYear < 2025) currentYear = 2025;
if(currentYear > 2044) currentYear = 2044;
let selectedLeave = 1;

/* 날짜 키 */
function dk(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDate(d){ return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+['일','월','화','수','목','금','토'][d.getDay()]+')';}

/* 연도별 공휴일 맵 생성 */
function getHolidayMap(year){
  const map = {};
  // 고정 공휴일
  FIXED.forEach(([m,d,name,emoji])=>{
    const key = year+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(!map[key]) map[key]=[];
    map[key].push({name,emoji,type:'holiday'});
  });
  // 음력 공휴일
  LUNAR.filter(r=>r[0]===year).forEach(([y,m,d,name])=>{
    const key = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(!map[key]) map[key]=[];
    const emoji = name.includes('설날')?'🏮':name.includes('추석')?'🌕':'🪷';
    const exists = map[key].some(x=>x.name===name);
    if(!exists) map[key].push({name,emoji,type:'holiday'});
  });
  // 대체공휴일 계산
  const keys = Object.keys(map);
  const subKeys = new Set();
  keys.forEach(key=>{
    const dt = parseDate(key);
    const dow = dt.getDay();
    if(dow===0){ // 일요일
      let sub = addDays(dt,1);
      while(map[dk(sub)] || subKeys.has(dk(sub)) || sub.getDay()===0 || sub.getDay()===6){
        sub = addDays(sub,1);
      }
      const sk = dk(sub);
      subKeys.add(sk);
      if(!map[sk]) map[sk]=[];
      map[sk].push({name:'대체공휴일',emoji:'📅',type:'sub'});
    }
  });
  return map;
}

/* 연속 쉬는날 클러스터 계산 */
function getClusters(year, extraLeave=[]){
  const map = getHolidayMap(year);
  const leaveSet = new Set(extraLeave);
  // 1년 전체 날짜 순회
  const clusters = [];
  let cluster = null;
  const start = new Date(year,0,1);
  const end = new Date(year,11,31);
  for(let d=new Date(start); d<=end; d=addDays(d,1)){
    const key = dk(d);
    const dow = d.getDay();
    const isWeekend = dow===0||dow===6;
    const isHoliday = !!map[key];
    const isLeave = leaveSet.has(key);
    const isOff = isWeekend||isHoliday||isLeave;
    if(isOff){
      if(!cluster) cluster={start:new Date(d),end:new Date(d),days:[],holidayCount:0,leaveCount:0};
      else cluster.end=new Date(d);
      const info = map[key]||[];
      cluster.days.push({date:new Date(d),key,isWeekend,isHoliday,isLeave,info});
      if(isHoliday) cluster.holidayCount++;
      if(isLeave) cluster.leaveCount++;
    } else {
      if(cluster && cluster.days.length>=2) clusters.push(cluster);
      cluster=null;
    }
  }
  if(cluster && cluster.days.length>=2) clusters.push(cluster);
  return clusters;
}

/* 황금연휴 등급 */
function grade(days){
  if(days>=7) return 'super';
  if(days>=4) return 'golden';
  return 'normal';
}
function gradeLabel(days){
  if(days>=7) return '🏆 슈퍼황금연휴';
  if(days>=5) return '🥇 황금연휴';
  if(days>=4) return '🥈 황금연휴';
  return '🥉 연휴';
}

/* 렌더링 */
function renderYear(year){
  currentYear = year;
  document.querySelectorAll('.year-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.year)===year);
  });
  const clusters = getClusters(year);
  const list = document.getElementById('holiday-list');
  const significant = clusters.filter(c=>c.days.length>=3);
  if(!significant.length){
    list.innerHTML='<div style="text-align:center;color:var(--sub);padding:20px;">연휴 정보가 없습니다</div>';
    return;
  }
  list.innerHTML = significant.map(c=>{
    const len = c.days.length;
    const g = grade(len);
    const names = [];
    c.days.forEach(d=>{
      d.info.forEach(h=>{ if(!names.includes(h.emoji+' '+h.name)) names.push(h.emoji+' '+h.name); });
    });
    const dateStr = fmtDate(c.start)+' ~ '+fmtDate(c.end);
    const badges = c.days.map(d=>{
      if(d.isLeave) return `<span class="hc-item sub">연차</span>`;
      if(d.isHoliday) return d.info.map(h=>`<span class="hc-item">${h.emoji} ${h.name}</span>`).join('');
      return `<span class="hc-item weekend">${['일','월','화','수','목','금','토'][d.date.getDay()]}요일</span>`;
    }).join('');
    const tip = c.leaveCount>0 ? `<div class="hc-tip">📝 연차 ${c.leaveCount}일로 ${len}일 연휴!</div>` : '';
    return `
    <div class="holiday-card ${g}">
      <div class="hc-top">
        <span class="hc-title">${gradeLabel(len)}</span>
        <span class="hc-days ${g==='super'?'super':g==='golden'?'gold':''}">${len}일 연속</span>
      </div>
      <div class="hc-date">📅 ${dateStr}</div>
      <div class="hc-items">${badges}</div>
      ${tip}
    </div>`;
  }).join('');
  renderCalc();
}

/* 연차 계산기 */
function renderCalc(){
  const year = parseInt(document.getElementById('calc-year').value);
  const leave = selectedLeave;
  const map = getHolidayMap(year);
  // 모든 공휴일+주말 날짜 수집
  const offDays = new Set();
  const start = new Date(year,0,1);
  const end = new Date(year,11,31);
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    const dow=d.getDay();
    if(dow===0||dow===6||map[dk(d)]) offDays.add(dk(d));
  }
  // 연차 조합으로 가장 긴 연휴 찾기
  const results = [];
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    const key=dk(d);
    if(offDays.has(key)) continue;
    // 이 날부터 leave일 연차 사용
    const leaveDays=[];
    let cur=new Date(d);
    let added=0;
    while(added<leave){
      if(!offDays.has(dk(cur))){
        leaveDays.push(dk(cur));
        added++;
      }
      cur=addDays(cur,1);
    }
    const clusters=getClusters(year,leaveDays);
    const best=clusters.sort((a,b)=>b.days.length-a.days.length)[0];
    if(best && best.days.length>=3){
      results.push({leaveDays,cluster:best,total:best.days.length});
    }
  }
  results.sort((a,b)=>b.total-a.total);
  const seen=new Set();
  const unique=results.filter(r=>{
    const k=r.cluster.days[0].key;
    if(seen.has(k)) return false;
    seen.add(k); return true;
  }).slice(0,5);

  const el=document.getElementById('calc-result');
  if(!unique.length){el.innerHTML='<p style="color:var(--sub);font-size:0.85rem;padding:8px 0;">추천 연휴 조합이 없습니다</p>';return;}
  el.innerHTML=unique.map((r,i)=>`
    <div class="result-item ${r.total>=5?'gold':''}">
      <span class="result-days ${r.total>=5?'gold':''}">${r.total}일</span>
      <div class="result-name">${fmtDate(r.cluster.start)} ~ ${fmtDate(r.cluster.end)}</div>
      <div class="result-desc">연차 ${leave}일 사용 → ${r.total}일 연속 휴가 🎉</div>
    </div>`).join('');
}

function selectLeave(n){
  selectedLeave=n;
  document.querySelectorAll('.leave-btn').forEach(b=>{
    b.classList.toggle('active',parseInt(b.textContent)===n||b.textContent===n+'일');
  });
  renderCalc();
}

/* D-day */
function renderDday(){
  const today=new Date(); today.setHours(0,0,0,0);
  // 오늘 이후 가장 가까운 황금연휴
  for(let y=today.getFullYear();y<=2044;y++){
    const clusters=getClusters(y).filter(c=>c.days.length>=3);
    for(const c of clusters){
      if(c.start>=today){
        const diff=Math.round((c.start-today)/(1000*60*60*24));
        document.getElementById('dday-name').textContent=gradeLabel(c.days.length)+' ('+c.days.length+'일)';
        document.getElementById('dday-num').textContent=diff===0?'DAY!':diff;
        if(diff===0) document.querySelector('.dday-count span:first-child').textContent='';
        const names=[...new Set(c.days.flatMap(d=>d.info.map(h=>h.name)).filter(Boolean))];
        document.getElementById('dday-info').innerHTML=
          `<span class="dday-badge">${fmtDate(c.start)} ~ ${fmtDate(c.end)}</span>`+
          names.slice(0,2).map(n=>`<span class="dday-badge gold">${n}</span>`).join('');
        return;
      }
    }
  }
}

/* 초기화 */
function init(){
  // 연도 탭
  const bar=document.getElementById('year-bar');
  bar.innerHTML=YEARS.map(y=>`<button class="year-btn ${y===currentYear?'active':''}" data-year="${y}" onclick="renderYear(${y})">${y}년</button>`).join('');
  // 연차 계산기 연도 셀렉트
  const sel=document.getElementById('calc-year');
  sel.innerHTML=YEARS.map(y=>`<option value="${y}" ${y===currentYear?'selected':''}>${y}년</option>`).join('');
  renderDday();
  renderYear(currentYear);
}

init();
</script>
