<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#f5f6ff"/>
<title>Nebula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  font-family: 'Noto Sans KR', sans-serif;
  background: #f5f6ff;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  padding: 32px 20px 40px;
}

/* ── 다크모드 ── */
body.dark {
  background: #0d0a1e;
}
body.dark .app-title { color: #c0b0ff; }
body.dark .app-sub   { color: #6a5898; }

.theme-btn {
  position: fixed;
  top: 16px; right: 16px;
  background: rgba(255,255,255,0.18);
  border: none;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  color: #5540aa;
  backdrop-filter: blur(8px);
  z-index: 100;
  transition: all 0.22s;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 700;
}
body.dark .theme-btn { background: rgba(255,255,255,0.1); color: rgba(200,180,255,0.85); }
.theme-btn:hover { background: rgba(255,255,255,0.32); }

/* ── 배경 반짝이 ── */
.sparkle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkleAnim var(--d) ease-in-out infinite alternate;
}
@keyframes sparkleAnim {
  from { opacity: 0.08; transform: scale(0.8); }
  to   { opacity: 0.22; transform: scale(1.2); }
}

/* ── 헤더 ── */
.header {
  text-align: center;
  margin-bottom: 32px;
}

.nebula-char {
  display: block;
  width: 220px;
  margin: 0 auto 12px;
  filter: drop-shadow(0 4px 20px rgba(100,140,255,0.35));
  animation: charFloat 3.5s ease-in-out infinite;
}

@keyframes charFloat {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-10px); }
}

.app-title {
  font-size: 26px;
  font-weight: 900;
  color: #2c2060;
  letter-spacing: -0.5px;
}

.app-sub {
  font-size: 12px;
  color: #9090bb;
  margin-top: 5px;
  letter-spacing: 0.3px;
}

/* ── 카드 컨테이너 ── */
.cards {
  display: flex;
  gap: 16px;
  justify-content: center;
  width: 100%;
  max-width: 420px;
}

/* ── 카드 공통 ── */
.card {
  flex: 1;
  max-width: 190px;
  border-radius: 24px;
  padding: 28px 16px 24px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.13);
  transition: all 0.25s cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.12);
  opacity: 0;
  transition: opacity 0.25s;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.18);
}
.card:hover::before { opacity: 1; }
.card:active { transform: translateY(-2px); }

/* ── 천사글 카드 ── */
.angel-card {
  background: linear-gradient(145deg, #5580e0 0%, #7b5ed4 100%);
}

/* ── 악마글 카드 ── */
.devil-card {
  background: linear-gradient(145deg, #c84070 0%, #e06090 100%);
}

/* 카드 내부 글로우 */
.card-glow {
  position: absolute;
  width: 160px; height: 160px;
  border-radius: 50%;
  filter: blur(50px);
  opacity: 0.35;
  top: -30px; left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
}
.angel-card .card-glow { background: #a0c0ff; }
.devil-card .card-glow  { background: #ffb0c8; }

.card-char {
  width: 110px;
  display: block;
  margin: 0 auto 10px;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,0.25));
  animation: float 3s ease-in-out infinite;
}
.devil-card .card-char { animation-delay: -1.5s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-7px); }
}

.card-title {
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  margin-bottom: 8px;
  position: relative; z-index: 1;
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.card-desc {
  font-size: 12px;
  color: rgba(255,255,255,0.78);
  line-height: 1.7;
  margin-bottom: 20px;
  position: relative; z-index: 1;
  word-break: keep-all;
}

.card-btn {
  display: inline-block;
  padding: 9px 22px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.18);
  color: #fff;
  backdrop-filter: blur(8px);
  transition: all 0.22s;
  position: relative; z-index: 1;
  letter-spacing: -0.3px;
}

.card:hover .card-btn {
  background: rgba(255,255,255,0.32);
  border-color: rgba(255,255,255,0.85);
}
</style>
</head>
<body>

<button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 다크</button>

<!-- 배경 반짝이 -->
<div id="sparkles"></div>

<!-- 헤더 -->
<div class="header">
  <img class="nebula-char" src="nebula-char.png" alt="네뷸라"/>
  <div class="app-title">Nebula</div>
  <div class="app-sub">안개 속에 피어나는 희망</div>
</div>

<!-- 카드 -->
<div class="cards">

  <a class="card angel-card" href="posts.html?tab=angel">
    <div class="card-glow"></div>
    <img class="card-char" src="angel-char.png" alt="천사 네뷸라"/>
    <div class="card-title">천사</div>
    <div class="card-desc">희망과 소망을<br>익명으로 나눠요</div>
    <div class="card-btn">들어가기 →</div>
  </a>

  <a class="card devil-card" href="posts.html?tab=devil">
    <div class="card-glow"></div>
    <img class="card-char" src="devil-char.png" alt="악마 네뷸라"/>
    <div class="card-title">악마</div>
    <div class="card-desc">스트레스와 욕을<br>시원하게 털어요</div>
    <div class="card-btn">들어가기 →</div>
  </a>

</div>

<script>
// 테마
const _saved = localStorage.getItem('nebula-theme');
if (_saved === 'dark') {
  document.body.classList.add('dark');
  document.getElementById('themeBtn').textContent = '☀️ 라이트';
}
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️ 라이트' : '🌙 다크';
  localStorage.setItem('nebula-theme', isDark ? 'dark' : 'light');
}

// 배경 반짝이 생성
const wrap = document.getElementById('sparkles');
const colors = ['#c8d8ff','#d8c8ff','#ffc8e0','#c8eeff','#e8c8ff'];
for (let i = 0; i < 18; i++) {
  const s = document.createElement('div');
  s.className = 'sparkle';
  const size = Math.random() * 60 + 20;
  const color = colors[Math.floor(Math.random() * colors.length)];
  s.style.cssText = `
    width:${size}px; height:${size}px;
    background:${color};
    left:${Math.random()*100}%;
    top:${Math.random()*100}%;
    --d:${(Math.random()*3+2).toFixed(1)}s;
    animation-delay:${(Math.random()*4).toFixed(1)}s;
  `;
  wrap.appendChild(s);
}
</script>
</body>
</html>
