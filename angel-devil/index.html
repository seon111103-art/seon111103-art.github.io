<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1a0050"/>
<title>네뷸라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans KR', sans-serif;
}

body {
  background: #0d0020;
  display: flex;
  flex-direction: column;
}

/* 별 파티클 */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--d) ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.1; }
  to   { opacity: 0.9; }
}

/* ── 헤더 ── */
.header {
  text-align: center;
  padding: 20px 20px 14px;
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}

/* 캐릭터 */
.nebula-char {
  display: block;
  width: 160px;
  margin: 0 auto 8px;
  filter: drop-shadow(0 0 28px rgba(180,120,255,0.8)) drop-shadow(0 6px 16px rgba(0,0,0,0.5));
  animation: charFloat 3.5s ease-in-out infinite;
}

@keyframes charFloat {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-10px); }
}

.app-title {
  font-size: 28px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -1px;
  text-shadow: 0 0 30px rgba(140,80,255,0.8);
}

.app-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

/* ── 메인 스플릿 ── */
.split {
  display: flex;
  flex: 1;
  position: relative;
  z-index: 1;
  overflow: hidden;
}

.side {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  position: relative;
  overflow: hidden;
  transition: flex 0.4s cubic-bezier(.4,0,.2,1);
}

.side:hover { flex: 1.15; }
.side:active { flex: 0.9; }

.angel-side {
  background: linear-gradient(160deg, #1a0050 0%, #3d1a8f 40%, #5c35cc 100%);
}

.devil-side {
  background: linear-gradient(160deg, #3d0000 0%, #7b0000 50%, #c62828 100%);
}

/* 빛나는 배경 (마우스 따라다님) */
.glow {
  position: absolute;
  width: 380px; height: 380px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.45;
  pointer-events: none;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  transition: top 0.08s ease-out, left 0.08s ease-out;
}

.angel-side .glow { background: #9c6fff; }
.devil-side .glow  { background: #ff4444; }

/* 콘텐츠 */
.side-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 16px;
}

.side-emoji {
  font-size: 52px;
  display: block;
  margin-bottom: 14px;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
  animation: float 3s ease-in-out infinite;
}

.devil-side .side-emoji { animation-delay: -1.5s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-8px); }
}

.side-title {
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

.side-desc {
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  line-height: 1.7;
  margin-bottom: 22px;
  word-break: keep-all;
}

.enter-btn {
  display: inline-block;
  padding: 10px 24px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  border: 2px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.12);
  color: #fff;
  backdrop-filter: blur(8px);
  transition: all 0.22s cubic-bezier(.4,0,.2,1);
  cursor: pointer;
  letter-spacing: -0.3px;
}

.side:hover .enter-btn {
  background: rgba(255,255,255,0.22);
  border-color: rgba(255,255,255,0.7);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.angel-side .particle { background: rgba(156,111,255,0.2); }
.devil-side .particle { background: rgba(255,68,68,0.2); }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- 헤더: 캐릭터 → 타이틀 → 태그라인 -->
<div class="header">
  <img class="nebula-char" src="nebula-char.png" alt="네뷸라"/>
  <div class="app-title">네뷸라</div>
  <div class="app-sub">안개 속에 피어나는 희망</div>
</div>

<!-- 스플릿 -->
<div class="split">

  <a class="side angel-side" href="posts.html?tab=angel">
    <div class="glow"></div>
    <div class="particle" style="width:100px;height:100px;top:-20px;right:-10px;"></div>
    <div class="particle" style="width:50px;height:50px;bottom:30px;left:10px;"></div>
    <div class="side-content">
      <span class="side-emoji">✨</span>
      <div class="side-title">천사글</div>
      <div class="side-desc">희망과 소망을<br>익명으로 나눠요</div>
      <div class="enter-btn">들어가기 →</div>
    </div>
  </a>

  <a class="side devil-side" href="posts.html?tab=devil">
    <div class="glow"></div>
    <div class="particle" style="width:90px;height:90px;top:-15px;left:-10px;"></div>
    <div class="particle" style="width:60px;height:60px;bottom:50px;right:10px;"></div>
    <div class="side-content">
      <span class="side-emoji">😈</span>
      <div class="side-title">악마글</div>
      <div class="side-desc">스트레스와 욕을<br>시원하게 털어요</div>
      <div class="enter-btn">들어가기 →</div>
    </div>
  </a>

</div>

<script>
// 별 생성
const starsEl = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*2+1.5).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

// 마우스 커서 따라다니는 글로우
document.querySelectorAll('.side').forEach(side => {
  const glow = side.querySelector('.glow');
  side.addEventListener('mousemove', (e) => {
    const rect = side.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    glow.style.left = x + 'px';
    glow.style.top  = y + 'px';
    glow.style.transform = 'translate(-50%, -50%)';
  });
  // 터치 지원
  side.addEventListener('touchmove', (e) => {
    const rect = side.getBoundingClientRect();
    const t = e.touches[0];
    glow.style.left = (t.clientX - rect.left) + 'px';
    glow.style.top  = (t.clientY - rect.top)  + 'px';
    glow.style.transform = 'translate(-50%, -50%)';
  }, { passive: true });
});
</script>
</body>
</html>
