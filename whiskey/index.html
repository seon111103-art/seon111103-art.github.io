<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>글렌우드 | GLENWOOD — 전세계 위스키 도감</title>
<meta name="description" content="글렌우드(Glenwood) — 스코틀랜드·아이리시·일본·미국 위스키 35종 도감. 테이스팅 노트, 레이더 차트, 국내 가격 비교."/>
<meta name="google-adsense-account" content="ca-pub-5695400087151759">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5695400087151759" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#120A00;--card:#1E1000;--card2:#2A1800;--card3:#341F00;
  --gold:#C9A84C;--gold-light:#F0D080;--gold-dim:#7A6030;
  --text:#F0E0C0;--sub:#907050;--faint:#503A20;
  --border:#3A2510;
  --shadow:0 4px 20px rgba(0,0,0,0.6);
  --shadow-gold:0 4px 24px rgba(201,168,76,0.18);
  --radius:14px;--radius-lg:22px;
  --tr:all 0.22s cubic-bezier(.4,0,.2,1);
}
/* ── 라이트 모드 ── */
html.light{
  --bg:#FDF6EC;--card:#FFF8F0;--card2:#F5ECD8;--card3:#EDE0C8;
  --gold:#9A6A10;--gold-light:#7A5008;--gold-dim:#B88830;
  --text:#2A1800;--sub:#7A5830;--faint:#A07848;
  --border:#E0C898;
  --shadow:0 4px 20px rgba(100,60,0,0.12);
  --shadow-gold:0 4px 24px rgba(180,130,40,0.18);
}
html.light header{background:linear-gradient(160deg,#8B4A00 0%,#B86800 40%,#D4880A 100%);}
html.light .header-deco{background:radial-gradient(ellipse 60% 40% at 50% 20%,rgba(255,210,100,0.15) 0%,transparent 70%);}
html.light h1.site-title{color:#FFF8E8;}
html.light .site-en{color:rgba(255,240,200,0.7);}
html.light .site-meaning{color:rgba(255,240,200,0.85);}
html.light .site-meaning em{color:#FFE090;}
html.light .site-sub{color:rgba(255,240,200,0.6);}
html.light .header-wave{fill:#FDF6EC;}
html.light .w-select option{background:#FFF8F0;color:#2A1800;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.25s,color 0.25s;}
/* ── 테마 토글 ── */
.theme-toggle{
  position:fixed;top:14px;right:14px;z-index:10000;
  background:rgba(201,168,76,0.15);border:1.5px solid var(--gold-dim);
  border-radius:20px;padding:6px 14px;cursor:pointer;
  color:var(--gold);font-size:0.82rem;font-weight:700;
  font-family:'Noto Sans KR',sans-serif;transition:var(--tr);
}
.theme-toggle:hover{background:rgba(201,168,76,0.25);}

/* ─── 헤더 ─── */
header{
  background:linear-gradient(160deg,#080400 0%,#150900 40%,#2A1400 100%);
  padding:54px 20px 0; text-align:center; position:relative; overflow:hidden;
}
.header-deco{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse 60% 40% at 50% 20%, rgba(201,168,76,0.08) 0%, transparent 70%);
  pointer-events:none;
}
.header-icon{font-size:3.2rem;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(201,168,76,0.5));}
h1.site-title{font-size:2.2rem;font-weight:900;color:var(--gold-light);letter-spacing:4px;}
.site-en{font-size:0.72rem;letter-spacing:6px;color:var(--gold-dim);margin-top:4px;font-weight:700;text-transform:uppercase;}
.site-meaning{font-size:0.78rem;color:var(--sub);margin-top:8px;line-height:1.6;}
.site-meaning em{color:var(--gold);font-style:normal;font-weight:700;}
.site-sub{font-size:0.82rem;color:var(--faint);margin-top:14px;margin-bottom:28px;letter-spacing:1px;}
.header-wave{display:block;width:100%;height:40px;fill:var(--bg);}

/* ─── 탭 ─── */
.tabs{display:flex;justify-content:center;gap:6px;padding:24px 20px 0;max-width:700px;margin:0 auto;}
.tab-btn{
  flex:1;padding:11px 8px;border:1.5px solid var(--border);border-radius:30px;
  background:var(--card);color:var(--sub);font-size:0.9rem;font-weight:700;
  cursor:pointer;transition:var(--tr);font-family:'Noto Sans KR',sans-serif;
}
.tab-btn:hover{border-color:var(--gold-dim);color:var(--text);}
.tab-btn.active{background:var(--gold);border-color:var(--gold);color:#1A0A00;}
.tab-content{display:none;max-width:700px;margin:0 auto;padding:24px 16px 80px;}
.tab-content.active{display:block;}

/* ─── 검색/필터 ─── */
.search-wrap{position:relative;margin-bottom:16px;}
.search-input{
  width:100%;padding:12px 16px 12px 42px;
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:0.92rem;font-family:'Noto Sans KR',sans-serif;
}
.search-input:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(201,168,76,0.1);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:1rem;}
.filter-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.chip{
  padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;
  background:var(--card);color:var(--sub);font-size:0.78rem;font-weight:700;
  cursor:pointer;transition:var(--tr);white-space:nowrap;
}
.chip:hover{border-color:var(--gold-dim);color:var(--text);}
.chip.active{background:var(--card2);border-color:var(--gold);color:var(--gold);}
.filter-sep{width:1px;background:var(--border);align-self:stretch;}

/* ─── 위스키 카드 ─── */
.whiskey-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.w-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);
  padding:18px 16px;cursor:pointer;transition:var(--tr);position:relative;overflow:hidden;
}
.w-card:hover{transform:translateY(-3px);border-color:var(--gold-dim);box-shadow:var(--shadow-gold);}
.w-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  opacity:0;transition:var(--tr);
}
.w-card:hover::before{opacity:1;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.country-badge{
  font-size:0.7rem;font-weight:700;padding:3px 8px;border-radius:10px;
  background:var(--card2);color:var(--gold);border:1px solid var(--border);
}
.abv-badge{font-size:0.72rem;color:var(--sub);font-weight:700;}
.card-icon{font-size:2rem;text-align:center;margin-bottom:8px;}
.card-name-ko{font-size:0.95rem;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3;}
.card-name-en{font-size:0.72rem;color:var(--sub);margin-bottom:8px;}
.card-dist{font-size:0.75rem;color:var(--faint);margin-bottom:6px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:0.68rem;padding:2px 7px;border-radius:8px;background:var(--card3);color:var(--sub);}
.card-desc{font-size:0.78rem;color:var(--sub);margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.no-result{text-align:center;color:var(--sub);padding:60px 20px;font-size:0.9rem;}

/* ─── 테이스팅 탭 ─── */
.tasting-selectors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.select-wrap label{display:block;font-size:0.78rem;color:var(--sub);margin-bottom:5px;}
.w-select{
  width:100%;padding:10px 12px;background:var(--card);
  border:1.5px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:0.85rem;font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
}
.w-select:focus{outline:none;border-color:var(--gold-dim);}
.chart-wrap{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;margin-bottom:14px;
}
.chart-title{font-size:0.95rem;font-weight:700;color:var(--gold);margin-bottom:16px;text-align:center;}
.chart-container{position:relative;width:100%;max-width:320px;margin:0 auto;}
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.note-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;}
.note-label{font-size:0.72rem;color:var(--gold);font-weight:700;margin-bottom:6px;}
.note-text{font-size:0.82rem;color:var(--text);line-height:1.6;}
.note-card.full{grid-column:1/-1;}
.info-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.info-pill{
  padding:6px 14px;background:var(--card2);border:1px solid var(--border);
  border-radius:20px;font-size:0.78rem;
}
.info-pill span{color:var(--sub);}
.info-pill strong{color:var(--gold);}

/* ─── 가격 탭 ─── */
.price-sort{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.sort-btn{
  padding:7px 14px;border:1.5px solid var(--border);border-radius:20px;
  background:var(--card);color:var(--sub);font-size:0.78rem;font-weight:700;
  cursor:pointer;transition:var(--tr);
}
.sort-btn:hover,.sort-btn.active{border-color:var(--gold-dim);color:var(--gold);background:var(--card2);}
.price-table{width:100%;border-collapse:collapse;}
.price-table thead th{
  padding:10px 8px;font-size:0.75rem;color:var(--sub);font-weight:700;
  border-bottom:1px solid var(--border);text-align:left;background:var(--card);
  position:sticky;top:0;
}
.price-table tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:var(--tr);}
.price-table tbody tr:hover{background:var(--card2);}
.price-table td{padding:11px 8px;font-size:0.82rem;}
.pt-name{font-weight:700;color:var(--text);}
.pt-en{font-size:0.7rem;color:var(--sub);}
.pt-country{font-size:1rem;}
.pt-type{font-size:0.7rem;color:var(--sub);}
.pt-price{font-weight:700;color:var(--gold);}
.pt-rt{color:var(--sub);font-size:0.8rem;}
.tier{
  display:inline-block;padding:2px 7px;border-radius:8px;
  font-size:0.66rem;font-weight:700;white-space:nowrap;
}
.tier-budget{background:#1A3020;color:#4CAF50;}
.tier-mid{background:#1A2040;color:#64B5F6;}
.tier-premium{background:#2A1A00;color:#FFB74D;}
.tier-luxury{background:#2A0A20;color:#CE93D8;}

/* ─── 모달 ─── */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);
  z-index:1000;overflow-y:auto;padding:20px;
}
.modal-bg.open{display:flex;align-items:flex-start;justify-content:center;}
.modal{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);
  padding:28px 24px;max-width:500px;width:100%;margin:auto;position:relative;
}
.modal-close{
  position:absolute;top:16px;right:16px;
  background:var(--card2);border:none;border-radius:50%;width:32px;height:32px;
  color:var(--sub);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--tr);
}
.modal-close:hover{background:var(--card3);color:var(--text);}
.modal-icon{font-size:2.8rem;text-align:center;margin-bottom:12px;}
.modal-title{font-size:1.3rem;font-weight:900;color:var(--gold-light);text-align:center;margin-bottom:4px;}
.modal-en{font-size:0.82rem;color:var(--sub);text-align:center;margin-bottom:20px;}
.modal-chart{max-width:260px;margin:0 auto 20px;}
.modal-notes{display:grid;gap:8px;}
.modal-note{background:var(--card2);border-radius:var(--radius);padding:12px;}
.modal-note-label{font-size:0.7rem;color:var(--gold);font-weight:700;margin-bottom:4px;}
.modal-note-text{font-size:0.82rem;color:var(--text);line-height:1.5;}
.modal-desc{font-size:0.85rem;color:var(--sub);line-height:1.7;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.modal-prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.modal-price-card{background:var(--card2);border-radius:var(--radius);padding:12px;text-align:center;}
.modal-price-card p{font-size:0.72rem;color:var(--sub);margin-bottom:4px;}
.modal-price-card strong{font-size:1.05rem;color:var(--gold);font-weight:700;}

/* ─── 푸터 ─── */
footer{text-align:center;padding:28px 20px;border-top:1px solid var(--border);font-size:0.78rem;color:var(--sub);}
footer a{color:var(--gold-dim);text-decoration:none;margin:0 7px;}
footer a:hover{color:var(--gold);}

@media(max-width:440px){
  .whiskey-grid{grid-template-columns:1fr;}
  .tasting-selectors{grid-template-columns:1fr;}
  .notes-grid{grid-template-columns:1fr;}
  .modal-prices{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️ 라이트</button>

<header>
  <div class="header-deco"></div>
  <img src="character.png" alt="글렌우드 캐릭터" style="width:110px;height:auto;margin-bottom:4px;filter:drop-shadow(0 4px 12px rgba(201,168,76,0.4));">
  <h1 class="site-title">글렌우드</h1>
  <p class="site-en">G L E N W O O D</p>
  <p class="site-meaning">
    <em>Glen</em> — 위스키가 태어나는 스코틀랜드 깊은 계곡&nbsp;&nbsp;·&nbsp;&nbsp;<em>Wood</em> — 풍미를 완성하는 오크나무통
  </p>
  <p class="site-sub">전세계 35종 위스키 · 테이스팅 노트 · 국내 가격 비교</p>
  <svg class="header-wave" viewBox="0 0 1440 40" preserveAspectRatio="none">
    <path d="M0,24 C360,40 1080,8 1440,24 L1440,40 L0,40 Z"/>
  </svg>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('guide')">📖 도감</button>
  <button class="tab-btn" onclick="switchTab('tasting')">🥃 테이스팅</button>
  <button class="tab-btn" onclick="switchTab('price')">💰 가격</button>
</div>

<!-- ─── 도감 탭 ─── -->
<div id="tab-guide" class="tab-content active">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search-input" type="text" placeholder="위스키 이름 검색..." oninput="renderGuide()"/>
  </div>
  <div class="filter-chips" id="filter-country">
    <button class="chip active" data-v="all" onclick="setFilter('country','all')">전체</button>
    <button class="chip" data-v="scotland" onclick="setFilter('country','scotland')">🏴󠁧󠁢󠁳󠁣󠁴󠁿 스코틀랜드</button>
    <button class="chip" data-v="ireland" onclick="setFilter('country','ireland')">🇮🇪 아이리시</button>
    <button class="chip" data-v="japan" onclick="setFilter('country','japan')">🇯🇵 일본</button>
    <button class="chip" data-v="usa" onclick="setFilter('country','usa')">🇺🇸 미국</button>
  </div>
  <div class="filter-chips" id="filter-type">
    <button class="chip active" data-v="all" onclick="setFilter('type','all')">전체</button>
    <button class="chip" data-v="single_malt" onclick="setFilter('type','single_malt')">싱글몰트</button>
    <button class="chip" data-v="blended" onclick="setFilter('type','blended')">블렌디드</button>
    <button class="chip" data-v="bourbon" onclick="setFilter('type','bourbon')">버번</button>
    <button class="chip" data-v="pot_still" onclick="setFilter('type','pot_still')">팟스틸</button>
  </div>
  <div class="whiskey-grid" id="guide-grid"></div>
</div>

<!-- ─── 테이스팅 탭 ─── -->
<div id="tab-tasting" class="tab-content">
  <div class="tasting-selectors">
    <div class="select-wrap">
      <label>위스키 A</label>
      <select class="w-select" id="sel-a" onchange="renderTasting()"></select>
    </div>
    <div class="select-wrap">
      <label>위스키 B (비교)</label>
      <select class="w-select" id="sel-b" onchange="renderTasting()">
        <option value="">— 선택 안함 —</option>
      </select>
    </div>
  </div>
  <div class="chart-wrap">
    <div class="chart-title" id="chart-title">테이스팅 레이더</div>
    <div class="chart-container"><canvas id="radar-chart"></canvas></div>
  </div>
  <div id="tasting-info-a"></div>
  <div id="tasting-info-b"></div>
</div>

<!-- ─── 가격 탭 ─── -->
<div id="tab-price" class="tab-content">
  <div class="price-sort">
    <span style="font-size:0.8rem;color:var(--sub);align-self:center;">정렬:</span>
    <button class="sort-btn active" data-sort="name" onclick="setSortPrice('name')">이름순</button>
    <button class="sort-btn" data-sort="df" onclick="setSortPrice('df')">면세가↑</button>
    <button class="sort-btn" data-sort="df-desc" onclick="setSortPrice('df-desc')">면세가↓</button>
    <button class="sort-btn" data-sort="country" onclick="setSortPrice('country')">나라순</button>
  </div>
  <div style="overflow-x:auto;border-radius:var(--radius-lg);border:1.5px solid var(--border);">
    <table class="price-table">
      <thead>
        <tr>
          <th>위스키</th>
          <th>종류</th>
          <th style="text-align:right;">면세가</th>
          <th style="text-align:right;">소매가</th>
          <th>등급</th>
        </tr>
      </thead>
      <tbody id="price-tbody"></tbody>
    </table>
  </div>
  <p style="font-size:0.72rem;color:var(--sub);margin-top:12px;line-height:1.6;">※ 가격은 700mL 기준 참고가이며, 실제 판매가와 다를 수 있습니다. 면세점은 인천공항 기준.</p>
</div>

<!-- ─── 모달 ─── -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" id="modal-body">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-icon" id="m-icon"></div>
    <div class="modal-title" id="m-title"></div>
    <div class="modal-en" id="m-en"></div>
    <div class="info-row" id="m-info"></div>
    <div class="modal-chart"><canvas id="modal-radar"></canvas></div>
    <div class="modal-notes" id="m-notes"></div>
    <div class="modal-prices" id="m-prices"></div>
    <div class="modal-desc" id="m-desc"></div>
  </div>
</div>

<footer>
  © 2026 꿀단지
  <a href="/whiskey/guide.html">이용 가이드</a>
  <a href="/whiskey/privacy.html">개인정보처리방침</a>
  <a href="/whiskey/terms.html">이용약관</a>
  <a href="/">꿀단지 홈</a>
</footer>

<script>
const CTRY = {scotland:'🏴󠁧󠁢󠁳󠁣󠁴󠁿 스코틀랜드', ireland:'🇮🇪 아이리시', japan:'🇯🇵 일본', usa:'🇺🇸 미국'};
const TYPE = {single_malt:'싱글몰트',blended:'블렌디드',bourbon:'버번',pot_still:'팟스틸',grain:'그레인'};
const ICON = {scotland:'🏔️',ireland:'🍀',japan:'⛩️',usa:'🤠'};

// ─── 상태 ───
let filterCountry = 'all', filterType = 'all';
let priceSort = 'name';
let radarChart = null, modalRadarChart = null;

// ─── 탭 전환 ───
function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const names = ['guide','tasting','price'];
    b.classList.toggle('active', names[i] === t);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if (t === 'tasting') initTasting();
  if (t === 'price') renderPrice();
}

// ─── 필터 ───
function setFilter(type, val) {
  if (type === 'country') filterCountry = val;
  else filterType = val;
  document.querySelectorAll(`#filter-${type} .chip`).forEach(c => {
    c.classList.toggle('active', c.dataset.v === val);
  });
  renderGuide();
}

// ─── 도감 렌더 ───
function renderGuide() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const list = WHISKIES.filter(w => {
    const matchCountry = filterCountry === 'all' || w.country === filterCountry;
    const matchType = filterType === 'all' || w.type === filterType;
    const matchQ = !q || w.ko.toLowerCase().includes(q) || w.name.toLowerCase().includes(q) || w.dist.toLowerCase().includes(q);
    return matchCountry && matchType && matchQ;
  });
  const grid = document.getElementById('guide-grid');
  if (!list.length) { grid.innerHTML = '<p class="no-result">검색 결과가 없습니다.</p>'; return; }
  grid.innerHTML = list.map(w => `
    <div class="w-card" onclick="openModal(${w.id})">
      <div class="card-top">
        <span class="country-badge">${CTRY[w.country]}</span>
        <span class="abv-badge">${w.abv}%</span>
      </div>
      <div class="card-icon">${ICON[w.country]}</div>
      <div class="card-name-ko">${w.ko}</div>
      <div class="card-name-en">${w.name}</div>
      <div class="card-dist">📍 ${w.dist} · ${w.region}</div>
      <div class="card-tags">
        <span class="tag">${TYPE[w.type]}</span>
        ${w.age ? `<span class="tag">${w.age}년</span>` : ''}
        <span class="tag">${smokyLabel(w.t.sm)}</span>
      </div>
      <div class="card-desc">${w.desc}</div>
    </div>
  `).join('');
}

function smokyLabel(v) {
  if (v <= 2) return '🌸 논피트';
  if (v <= 5) return '💨 라이트피트';
  if (v <= 7) return '🔥 미디엄피트';
  return '💀 헤비피트';
}

// ─── 모달 ───
function openModal(id) {
  const w = WHISKIES.find(x => x.id === id);
  if (!w) return;
  document.getElementById('m-icon').textContent = ICON[w.country];
  document.getElementById('m-title').textContent = w.ko;
  document.getElementById('m-en').textContent = `${w.name} · ${w.dist}`;
  document.getElementById('m-info').innerHTML = `
    <div class="info-pill"><span>나라</span> <strong>${CTRY[w.country]}</strong></div>
    <div class="info-pill"><span>종류</span> <strong>${TYPE[w.type]}</strong></div>
    <div class="info-pill"><span>도수</span> <strong>${w.abv}%</strong></div>
    ${w.age ? `<div class="info-pill"><span>숙성</span> <strong>${w.age}년</strong></div>` : ''}
    <div class="info-pill"><span>지역</span> <strong>${w.region}</strong></div>
  `;
  document.getElementById('m-notes').innerHTML = `
    <div class="modal-note"><div class="modal-note-label">🌿 아로마</div><div class="modal-note-text">${w.notes.ar}</div></div>
    <div class="modal-note"><div class="modal-note-label">👅 테이스트</div><div class="modal-note-text">${w.notes.ta}</div></div>
    <div class="modal-note"><div class="modal-note-label">🌊 피니시</div><div class="modal-note-text">${w.notes.fi}</div></div>
  `;
  document.getElementById('m-prices').innerHTML = `
    <div class="modal-price-card"><p>✈️ 면세가</p><strong>₩${w.price.df.toLocaleString()}</strong></div>
    <div class="modal-price-card"><p>🏪 소매가</p><strong>₩${w.price.rt.toLocaleString()}</strong></div>
  `;
  document.getElementById('m-desc').textContent = w.desc;

  if (modalRadarChart) modalRadarChart.destroy();
  const ctx = document.getElementById('modal-radar').getContext('2d');
  modalRadarChart = buildRadar(ctx, [w], ['rgba(201,168,76,0.25)'], ['#C9A84C']);

  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-bg') || e.target.classList.contains('modal-close'))
    document.getElementById('modal-bg').classList.remove('open');
}

// ─── 테이스팅 탭 ───
function initTasting() {
  const selA = document.getElementById('sel-a');
  const selB = document.getElementById('sel-b');
  if (selA.options.length > 0) return;
  WHISKIES.forEach(w => {
    const o1 = new Option(w.ko, w.id);
    const o2 = new Option(w.ko, w.id);
    selA.add(o1); selB.add(o2);
  });
  renderTasting();
}

function renderTasting() {
  const idA = parseInt(document.getElementById('sel-a').value);
  const idB = parseInt(document.getElementById('sel-b').value) || null;
  const wA = WHISKIES.find(x => x.id === idA);
  const wB = idB ? WHISKIES.find(x => x.id === idB) : null;

  document.getElementById('chart-title').textContent = wB
    ? `${wA.ko} vs ${wB.ko}`
    : `${wA.ko} 테이스팅 노트`;

  if (radarChart) radarChart.destroy();
  const ctx = document.getElementById('radar-chart').getContext('2d');
  if (wB) {
    radarChart = buildRadar(ctx,
      [wA, wB],
      ['rgba(201,168,76,0.2)', 'rgba(100,180,255,0.2)'],
      ['#C9A84C', '#64B4FF']
    );
  } else {
    radarChart = buildRadar(ctx, [wA], ['rgba(201,168,76,0.25)'], ['#C9A84C']);
  }

  document.getElementById('tasting-info-a').innerHTML = tastingInfoHTML(wA, '#C9A84C');
  document.getElementById('tasting-info-b').innerHTML = wB ? tastingInfoHTML(wB, '#64B4FF') : '';
}

function tastingInfoHTML(w, color) {
  return `
    <div class="chart-wrap" style="border-color:${color}33;margin-bottom:10px;">
      <div class="chart-title" style="color:${color}">${w.ko}</div>
      <div class="info-row">
        <div class="info-pill"><span>도수</span> <strong style="color:${color}">${w.abv}%</strong></div>
        ${w.age ? `<div class="info-pill"><span>숙성</span> <strong style="color:${color}">${w.age}년</strong></div>` : ''}
        <div class="info-pill"><span>지역</span> <strong style="color:${color}">${w.region}</strong></div>
      </div>
      <div class="notes-grid">
        <div class="note-card"><div class="note-label" style="color:${color}">🌿 아로마</div><div class="note-text">${w.notes.ar}</div></div>
        <div class="note-card"><div class="note-label" style="color:${color}">👅 테이스트</div><div class="note-text">${w.notes.ta}</div></div>
        <div class="note-card full"><div class="note-label" style="color:${color}">🌊 피니시</div><div class="note-text">${w.notes.fi}</div></div>
      </div>
    </div>
  `;
}

function buildRadar(ctx, whiskies, bgColors, borderColors) {
  const labels = ['향기','달콤함','스모키','스파이시','과일향','오크'];
  return new Chart(ctx, {
    type: 'radar',
    data: {
      labels,
      datasets: whiskies.map((w, i) => ({
        label: w.ko,
        data: [w.t.ar, w.t.sw, w.t.sm, w.t.sp, w.t.fr, w.t.ok],
        backgroundColor: bgColors[i],
        borderColor: borderColors[i],
        borderWidth: 2,
        pointBackgroundColor: borderColors[i],
        pointRadius: 4,
      }))
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#C9A84C', font: { size: 11, family: 'Noto Sans KR' } } } },
      scales: {
        r: {
          min: 0, max: 10,
          ticks: { display: false, stepSize: 2 },
          pointLabels: { color: '#F0E0C0', font: { size: 11, family: 'Noto Sans KR' } },
          grid: { color: 'rgba(201,168,76,0.12)' },
          angleLines: { color: 'rgba(201,168,76,0.15)' },
        }
      }
    }
  });
}

// ─── 가격 탭 ───
function setSortPrice(s) {
  priceSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === s));
  renderPrice();
}

function renderPrice() {
  let list = [...WHISKIES];
  if (priceSort === 'df') list.sort((a,b) => a.price.df - b.price.df);
  else if (priceSort === 'df-desc') list.sort((a,b) => b.price.df - a.price.df);
  else if (priceSort === 'country') list.sort((a,b) => a.country.localeCompare(b.country));
  else list.sort((a,b) => a.ko.localeCompare(b.ko));

  document.getElementById('price-tbody').innerHTML = list.map(w => `
    <tr onclick="openModal(${w.id})">
      <td>
        <div class="pt-name">${w.ko}</div>
        <div class="pt-en">${w.name}</div>
      </td>
      <td>
        <div class="pt-country">${CTRY[w.country].split(' ')[0]}</div>
        <div class="pt-type">${TYPE[w.type]}</div>
      </td>
      <td style="text-align:right;"><span class="pt-price">₩${w.price.df.toLocaleString()}</span></td>
      <td style="text-align:right;"><span class="pt-rt">₩${w.price.rt.toLocaleString()}</span></td>
      <td><span class="tier ${tierClass(w.price.df)}">${tierLabel(w.price.df)}</span></td>
    </tr>
  `).join('');
}

function tierClass(p) {
  if (p < 45000) return 'tier-budget';
  if (p < 80000) return 'tier-mid';
  if (p < 150000) return 'tier-premium';
  return 'tier-luxury';
}
function tierLabel(p) {
  if (p < 45000) return '가성비';
  if (p < 80000) return '미드레인지';
  if (p < 150000) return '프리미엄';
  return '럭셔리';
}

// ─── 초기화 ───
renderGuide();

// ─── 테마 ───
function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  document.getElementById('theme-btn').textContent = isLight ? '🌙 다크' : '☀️ 라이트';
  localStorage.setItem('glenwood-theme', isLight ? 'light' : 'dark');
}
(function(){
  const saved = localStorage.getItem('glenwood-theme');
  if (saved === 'light') {
    document.documentElement.classList.add('light');
    document.getElementById('theme-btn').textContent = '🌙 다크';
  }
})();
</script>
