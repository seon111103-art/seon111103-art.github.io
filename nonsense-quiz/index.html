<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭉실뭉실 수수께끼</title>
<meta name="description" content="깔깔깔! 초등학생들을 위한 재미있는 수수께끼 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #dbeafe;
  --card: #ffffff;
  --border: #bae6fd;
  --text: #0c4a6e;
  --text-muted: #0369a1;
  --primary: #0ea5e9;
  --primary-dark: #0284c7;
  --shadow-sm: 0 3px 12px rgba(14,165,233,0.12);
  --shadow: 0 5px 22px rgba(14,165,233,0.16);
  --shadow-md: 0 10px 36px rgba(14,165,233,0.24);
  --transition: all 0.22s cubic-bezier(.4,0,.2,1);
  --radius: 20px;
  --radius-lg: 30px;
}
html.dark {
  --bg: #082f49;
  --card: #0c4a6e;
  --border: #075985;
  --text: #e0f2fe;
  --text-muted: #7dd3fc;
  --primary: #38bdf8;
  --primary-dark: #7dd3fc;
  --shadow-sm: 0 3px 12px rgba(0,0,0,0.35);
  --shadow: 0 5px 22px rgba(0,0,0,0.45);
  --shadow-md: 0 10px 36px rgba(0,0,0,0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Jua', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  background: linear-gradient(180deg, #bae6fd 0%, #dbeafe 45%, #f0f9ff 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
}
html.dark body {
  background: linear-gradient(180deg, #082f49 0%, #0c2a3f 50%, #0a1f30 100%);
  background-attachment: fixed;
}

/* ── 떠다니는 배경 장식 ── */
.bg-deco {
  position: fixed; pointer-events: none; z-index: 0;
  font-size: 2rem; opacity: 0.12;
  animation: floatUp 6s ease-in-out infinite;
  user-select: none;
}
html.dark .bg-deco { opacity: 0.07; }
.bg-deco:nth-child(1){ top:8%;  left:4%;  animation-delay:0s;   font-size:1.8rem; }
.bg-deco:nth-child(2){ top:20%; right:5%; animation-delay:1.2s; font-size:2.2rem; }
.bg-deco:nth-child(3){ top:50%; left:2%; animation-delay:2.4s; font-size:1.5rem; }
.bg-deco:nth-child(4){ top:70%; right:3%; animation-delay:0.8s; font-size:2rem; }
.bg-deco:nth-child(5){ top:85%; left:8%; animation-delay:3s;   font-size:1.6rem; }
@keyframes floatUp {
  0%,100% { transform: translateY(0) rotate(-5deg); }
  50%      { transform: translateY(-16px) rotate(5deg); }
}

/* ── HEADER ── */
header {
  background: linear-gradient(160deg, #0369a1 0%, #0ea5e9 55%, #38bdf8 85%, #7dd3fc 100%);
  padding: 48px 20px 0;
  text-align: center;
  position: relative;
  overflow: hidden;
  z-index: 1;
}
header::before {
  content: '';
  position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='90' height='60' viewBox='0 0 90 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cellipse cx='45' cy='42' rx='28' ry='15' fill='white' fill-opacity='0.06'/%3E%3Cellipse cx='30' cy='37' rx='16' ry='11' fill='white' fill-opacity='0.06'/%3E%3Cellipse cx='60' cy='37' rx='16' ry='11' fill='white' fill-opacity='0.06'/%3E%3C/svg%3E");
  background-size: 90px 60px;
}

/* 다크모드 토글 */
.theme-btn {
  position: fixed; top: 14px; right: 14px; z-index: 9999;
  background: rgba(255,255,255,0.22);
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 50px; width: 64px; height: 32px;
  cursor: pointer; display: flex; align-items: center;
  justify-content: space-between; padding: 0 7px;
  backdrop-filter: blur(8px); transition: var(--transition);
}
.theme-btn:hover { background: rgba(255,255,255,0.32); }
.theme-thumb {
  position: absolute; left: 3px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  transition: left 0.28s cubic-bezier(.4,0,.2,1);
}
html.dark .theme-thumb { left: calc(100% - 27px); }
.t-sun, .t-moon { font-size: 0.8rem; line-height:1; z-index:1; }

/* 마스코트 */
.mascot-wrap { position: relative; display: inline-block; margin-bottom: 4px; }
.mascot-img {
  width: 190px; height: 190px; object-fit: contain;
  filter: drop-shadow(0 6px 24px rgba(255,255,255,0.65)) drop-shadow(0 2px 8px rgba(3,105,161,0.3));
  animation: bounce 2.4s ease-in-out infinite;
  transition: filter 0.3s;
}
html.dark .mascot-img {
  filter: drop-shadow(0 6px 24px rgba(56,189,248,0.7)) brightness(0.88);
}
@keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }

/* 반응 캐릭터 (퀴즈 화면) */
.react-char {
  width: 110px; height: 110px; object-fit: contain;
  display: block; margin: 0 auto 6px;
  filter: drop-shadow(0 6px 18px rgba(255,255,255,0.6)) drop-shadow(0 2px 8px rgba(14,165,233,0.35));
  animation: bounce 2.4s ease-in-out infinite;
  transition: filter 0.3s;
}
html.dark .react-char {
  filter: drop-shadow(0 6px 20px rgba(56,189,248,0.65)) brightness(0.92);
}
.react-char.pop {
  animation: charPop 0.35s cubic-bezier(.4,0,.2,1), bounce 2.4s ease-in-out 0.35s infinite;
}
@keyframes charPop {
  0%  { transform: scale(0.65); opacity: 0.4; }
  65% { transform: scale(1.14); }
  100%{ transform: scale(1);    opacity: 1; }
}

/* 결과 캐릭터 */
.result-char {
  width: 190px; height: 190px; object-fit: contain;
  display: block; margin: 0 auto 10px;
  filter: drop-shadow(0 6px 22px rgba(255,255,255,0.6)) drop-shadow(0 2px 10px rgba(14,165,233,0.4));
  animation: bounce 2s ease-in-out infinite;
}
html.dark .result-char {
  filter: drop-shadow(0 6px 24px rgba(56,189,248,0.7)) brightness(0.9);
}

/* 타이틀 */
.title-row {
  display: flex; align-items: baseline; justify-content: center;
  gap: 8px; margin-top: 4px;
}
.title-main {
  font-family: 'Jua', sans-serif;
  font-size: 2.8rem; font-weight: 900; letter-spacing: 3px;
  color: #fde047;
  text-shadow:
    0 0 24px rgba(253,224,71,0.75),
    2px 3px 0 rgba(202,138,4,0.55),
    -1px -1px 0 rgba(255,255,255,0.4),
    4px 6px 12px rgba(3,105,161,0.25);
}
.title-sub {
  font-size: 1.1rem; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(90deg, #ff6b6b,#ffd93d,#6bcb77,#38bdf8,#a78bfa,#ff6b6b);
  background-size: 250%; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; background-clip: text;
  animation: rainbow 3s linear infinite;
}
@keyframes rainbow { 0%{background-position:0%} 100%{background-position:250%} }

.header-tag { color: rgba(255,255,255,0.88); font-size: 0.9rem; margin-top: 8px; font-weight: 700; }

.header-wave { display: block; width: 100%; height: 52px; margin-top: 14px; transition: fill 0.3s; }
html:not(.dark) .header-wave { fill: #bae6fd; }
html.dark .header-wave { fill: #082f49; }

/* ── MAIN ── */
.main {
  max-width: 500px; margin: 0 auto;
  padding: 8px 16px 60px; position: relative; z-index: 1;
}
.screen { display: none; }
.screen.active { display: block; }

/* ── 섹션 타이틀 ── */
.sec-title {
  font-size: 1.05rem; font-weight: 900;
  display: flex; align-items: center; gap: 6px;
  margin: 20px 0 10px; color: var(--text);
  padding-left: 10px;
  border-left: 4px solid var(--primary);
  border-radius: 2px;
}
.sec-title span { font-size: 1.2rem; }

/* ── 카테고리 카드 ── */
.cat-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 20px;
}
.cat-card {
  border-radius: var(--radius-lg);
  padding: 0; text-align: center;
  cursor: pointer; transition: var(--transition);
  position: relative; overflow: hidden;
  box-shadow: var(--shadow-sm);
  border: 3px solid transparent;
  height: 155px;
}
.cat-all { height: 110px; }
.cat-card::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(255,255,255,0.12);
  opacity: 0; transition: opacity 0.2s;
}
.cat-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow-md); }
.cat-card:hover::after { opacity: 1; }
.cat-card.selected {
  border-color: transparent;
  box-shadow: var(--shadow-md),
    0 0 22px 6px rgba(56,189,248,0.75);
  outline: none;
}
.cat-card.selected::before {
  content: '';
  position: absolute; inset: -3px;
  border-radius: calc(var(--radius-lg) + 3px);
  background: rgba(56,189,248,0.92);
  animation: whitePulse 1.8s ease-in-out infinite;
  z-index: -1;
}
.cat-card.selected::after {
  content: '✔';
  inset: auto;
  top: 8px; right: 8px;
  bottom: auto; left: auto;
  width: 26px; height: 26px;
  background: rgba(255,255,255,0.95);
  border-radius: 50%;
  text-align: center;
  line-height: 26px;
  font-size: 13px;
  color: #7c3aed;
  font-weight: 900;
  box-shadow: 0 2px 8px rgba(0,0,0,0.22);
  z-index: 10;
  opacity: 1;
  transition: none;
}
@keyframes whitePulse {
  0%, 100% { opacity: 0.80; }
  50%       { opacity: 1; }
}
.cat-all  { background: linear-gradient(135deg, #ff6b6b, #ff8e53); }
.cat-ani  { background: linear-gradient(135deg, #6bcb77, #22c55e); }
.cat-food { background: linear-gradient(135deg, #ffd93d, #fb923c); }
.cat-sch  { background: linear-gradient(135deg, #38bdf8, #818cf8); }
.cat-word { background: linear-gradient(135deg, #a78bfa, #f472b6); }
.cat-all  { grid-column: 1 / -1; }

.cat-icon {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.cat-text {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 8px 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 100%);
}
.cat-name { font-size: 0.92rem; font-weight: 900; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.4); line-height: 1.2; }
.cat-count { font-size: 0.70rem; color: rgba(255,255,255,0.88); margin-top: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }

/* ── 문제 수 선택 ── */
.count-row { display: flex; gap: 8px; margin-bottom: 18px; }
.cnt-btn {
  flex: 1; padding: 13px;
  background: var(--card); border: 2.5px solid var(--border);
  border-radius: var(--radius); font-size: 0.95rem; font-weight: 800;
  color: var(--text); cursor: pointer; transition: var(--transition);
  box-shadow: var(--shadow-sm); position: relative;
}
.cnt-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
.cnt-btn.on {
  background: var(--primary); border-color: transparent; color: #fff;
  animation: skyGlow 1.8s ease-in-out infinite;
}
.cnt-btn.on::after {
  content: '✔';
  position: absolute; top: 5px; right: 5px;
  width: 18px; height: 18px;
  background: rgba(255,255,255,0.92); border-radius: 50%;
  text-align: center; line-height: 18px;
  font-size: 10px; color: #0284c7; font-weight: 900;
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}

/* ── 시작 버튼 ── */
.start-btn {
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, #0284c7, #0ea5e9, #38bdf8);
  color: #fff; border: none; border-radius: var(--radius-lg);
  font-size: 1.15rem; font-weight: 900; cursor: pointer; letter-spacing: 0.5px;
  transition: var(--transition); position: relative; overflow: hidden;
  animation: skyGlow 1.8s ease-in-out infinite;
}
.start-btn::after {
  content: ''; position: absolute;
  top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
  opacity: 0; transition: opacity 0.3s;
}
.start-btn:hover { transform: translateY(-3px); animation: none; box-shadow: 0 8px 28px rgba(56,189,248,0.6); }
.start-btn:hover::after { opacity: 1; }

@keyframes skyGlow {
  0%, 100% { box-shadow: 0 0 0 3px rgba(56,189,248,0.55), 0 0 14px 3px rgba(56,189,248,0.4); }
  50%       { box-shadow: 0 0 0 3px rgba(56,189,248,1),   0 0 22px 6px rgba(56,189,248,0.75); }
}

/* ── 퀴즈 헤더 ── */
.quiz-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0 12px; gap: 8px;
}
.btn-home-quiz {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--card); border: 2px solid var(--border);
  box-shadow: var(--shadow-sm); cursor: pointer;
  font-size: 1rem; display: flex; align-items: center; justify-content: center;
  transition: var(--transition); flex-shrink: 0;
}
.btn-home-quiz:hover { background: #fee2e2; border-color: #fca5a5; transform: scale(1.08); }
.prog-text { font-size: 0.9rem; font-weight: 800; color: var(--text-muted); }
.score-pill {
  background: linear-gradient(135deg, #ffd93d, #fb923c);
  color: #fff; border-radius: 50px; padding: 5px 16px;
  font-size: 0.9rem; font-weight: 900;
  box-shadow: 0 2px 10px rgba(251,146,60,0.4);
}
.prog-bar {
  height: 10px; border-radius: 5px;
  background: var(--border); margin-bottom: 18px; overflow: hidden;
}
.prog-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, #0284c7, #38bdf8, #7dd3fc);
  transition: width 0.45s ease;
  position: relative; overflow: hidden;
}
.prog-fill::after {
  content: ''; position: absolute;
  top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 1.8s infinite;
}
@keyframes shimmer { 100%{ left: 100%; } }

/* ── 문제 카드 ── */
.quiz-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  border: 2.5px solid var(--border);
  box-shadow: var(--shadow), 0 0 0 6px rgba(186,230,253,0.3);
  padding: 28px 22px; text-align: center;
  margin-bottom: 14px; min-height: 185px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; transition: var(--transition);
}
.cat-tag {
  position: absolute; top: 12px; left: 12px;
  padding: 3px 10px; border-radius: 8px;
  font-size: 0.73rem; font-weight: 800; color: #fff;
}
.q-emoji { font-size: 2.4rem; margin-bottom: 10px; animation: wiggle 2s ease-in-out infinite; }
@keyframes wiggle {
  0%,100%{ transform: rotate(-4deg); }
  50%    { transform: rotate(4deg); }
}
.q-text { font-size: 1.18rem; font-weight: 800; line-height: 1.55; color: var(--text); }

/* ── 객관식 선택지 ── */
.choices {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 14px;
}
.choice-btn {
  padding: 15px 10px;
  background: var(--card); border: 2.5px solid var(--border);
  border-radius: var(--radius); font-size: 0.88rem; font-weight: 800;
  color: var(--text); cursor: pointer; transition: var(--transition);
  box-shadow: var(--shadow-sm); line-height: 1.35; text-align: center;
  word-break: keep-all;
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--primary); color: var(--primary);
  transform: translateY(-2px); box-shadow: var(--shadow);
}
.choice-btn.correct {
  background: linear-gradient(135deg, #6bcb77, #22c55e);
  border-color: #16a34a; color: #fff;
  box-shadow: 0 4px 16px rgba(34,197,94,0.45);
  animation: popIn 0.3s cubic-bezier(.4,0,.2,1);
  opacity: 1 !important;
}
.choice-btn.wrong {
  background: linear-gradient(135deg, #ff6b6b, #ef4444);
  border-color: #dc2626; color: #fff;
  box-shadow: 0 4px 16px rgba(239,68,68,0.45);
  animation: shake 0.4s ease;
  opacity: 1 !important;
}
.choice-btn:disabled { cursor: default; opacity: 0.55; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-7px); }
  40%      { transform: translateX(7px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}
@keyframes popIn {
  from { transform: scale(0.78) translateY(8px); opacity: 0; }
  to   { transform: scale(1) translateY(0);      opacity: 1; }
}

.reaction { font-size: 1.05rem; font-weight: 900; text-align: center; min-height: 30px; margin-bottom: 8px; }

/* ── 다음 문제 버튼 ── */
.btn-next-main {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #0284c7, #0ea5e9, #38bdf8);
  color: #fff; border: none; border-radius: var(--radius-lg);
  font-size: 1.05rem; font-weight: 900; cursor: pointer;
  box-shadow: 0 4px 16px rgba(14,165,233,0.4);
  transition: var(--transition); margin-bottom: 10px;
  animation: popIn 0.3s cubic-bezier(.4,0,.2,1);
}
.btn-next-main:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(14,165,233,0.55); }

/* ── 결과 화면 ── */
.result-wrap {
  background: var(--card);
  border-radius: var(--radius-lg); border: 3px solid var(--border);
  box-shadow: var(--shadow-md); padding: 36px 22px;
  text-align: center; margin-top: 16px;
}
.result-emoji { font-size: 4rem; display: block; margin-bottom: 8px; animation: bounce 1.5s ease-in-out infinite; }
.result-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 4px; }
.result-sub { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 22px; }
.score-box {
  border-radius: var(--radius); padding: 20px; margin-bottom: 22px;
  background: linear-gradient(135deg, #dbeafe, #e0f2fe);
}
html.dark .score-box { background: linear-gradient(135deg, #062a40, #072840); }
.score-num { font-size: 3.2rem; font-weight: 900; color: #0369a1; line-height: 1; }
html.dark .score-num { color: #38bdf8; }
.score-of { font-size: 0.92rem; color: var(--text-muted); margin-top: 2px; }
.score-msg { font-size: 1rem; font-weight: 800; margin-top: 8px; color: var(--text); }
.result-btns { display: flex; flex-direction: column; gap: 10px; }
.btn-retry {
  padding: 15px;
  background: linear-gradient(135deg, #0284c7, #0ea5e9, #38bdf8);
  color: #fff; border: none; border-radius: var(--radius);
  font-size: 1rem; font-weight: 900; cursor: pointer;
  box-shadow: 0 4px 16px rgba(14,165,233,0.4);
  transition: var(--transition);
}
.btn-retry:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(14,165,233,0.55); }
.btn-kakao {
  padding: 14px; background: #fee500; color: #3c1e1e;
  border: none; border-radius: var(--radius);
  font-size: 0.95rem; font-weight: 900; cursor: pointer; transition: var(--transition);
}
.btn-kakao:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(254,229,0,0.5); }
.btn-home {
  padding: 13px; background: transparent;
  border: 2.5px solid var(--border); border-radius: var(--radius);
  color: var(--text-muted); font-size: 0.9rem; cursor: pointer;
  transition: var(--transition);
}
.btn-home:hover { border-color: var(--primary); color: var(--primary); }

/* ── 콘페티 ── */
.confetti-wrap { position:fixed; inset:0; pointer-events:none; z-index:999; }
.cp {
  position: absolute; border-radius: 2px;
  animation: fall 2s ease-in forwards;
}
@keyframes fall {
  0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ── 랭킹 버튼 (홈 화면) ── */
.btn-ranking {
  width: 100%; padding: 13px; margin-top: 10px;
  background: transparent; border: 2.5px solid var(--border);
  border-radius: var(--radius); color: var(--text-muted);
  font-size: 0.9rem; font-weight: 900; cursor: pointer;
  transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-ranking:hover { border-color: #fbbf24; color: #b45309; background: #fffbeb; transform: translateY(-2px); }
html.dark .btn-ranking:hover { background: rgba(253,224,71,0.08); color: #fde047; border-color: #fde047; }

.rank-overlay {

}
.rank-overlay.open { opacity: 1; pointer-events: all; }
.rank-modal {
  background: var(--card); border-radius: var(--radius-lg);
  border: 3px solid var(--border); box-shadow: var(--shadow-md);

}

.rank-item {
  display: flex; align-items: center; gap: 10px;

.rank-item.top2 { border-color: #94a3b8; background: linear-gradient(135deg,#f8fafc,#f1f5f9); }
.rank-item.top3 { border-color: #cd7c2f; background: linear-gradient(135deg,#fff7ed,#ffedd5); }

.rank-num { font-size: 0.82rem; font-weight: 900; color: var(--text-muted); width: 22px; text-align: center; flex-shrink: 0; }
.rank-name { flex: 1; font-weight: 900; font-size: 0.95rem; color: var(--text); }
.rank-score {
  font-size: 0.95rem; font-weight: 900; color: #0369a1;

.btn-rank-close {

/* ── 반응형 ── */

const CAT_COLOR = { animal:'#22c55e', food:'#fb923c', school:'#38bdf8', word:'#a78bfa', all:'#ff6b6b' };

let selCat = 'all', selN = 5, list = [], idx = 0, score = 0, answered = false;

function setChar(name) {
  const el = document.getElementById('reactChar');
  el.classList.remove('pop');
  void el.offsetWidth; // reflow로 애니메이션 리셋
  el.src = name + '.png';
  el.classList.add('pop');
}

function pickCat(el) {
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selCat = el.dataset.cat;
}
function pickN(el) {
  document.querySelectorAll('.cnt-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  selN = +el.dataset.n;
}

function startQuiz() {
  let pool = selCat === 'all'
    ? Object.values(DB).flat()
    : [...DB[selCat]];
  list = shuffle(pool).slice(0, Math.min(selN, pool.length));
  idx = 0; score = 0;
  show('s-quiz'); render();
}

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function render() {
  answered = false;
  const q = list[idx], total = list.length;
  const cat = getCat(q);
  document.getElementById('progTxt').textContent  = `${idx+1} / ${total}`;
  document.getElementById('progFill').style.width = `${(idx/total)*100}%`;
  document.getElementById('scoreTxt').textContent = score;
  const tag = document.getElementById('catTag');
  tag.textContent = {animal:'🐶 동물',food:'🍕 음식',school:'📚 학교',word:'💬 말장난',all:'🎲 랜덤'}[cat] || '';
  tag.style.background = CAT_COLOR[cat] || '#ff6b6b';
  document.getElementById('qEmoji').textContent   = q.emoji;
  document.getElementById('qText').textContent    = q.q;
  document.getElementById('reaction').textContent = '';
  document.getElementById('btnNextMain').style.display = 'none';

  // 선택지 생성 (정답 1 + 오답 3 섞기)
  const allChoices = shuffle([q.a, ...q.choices]);
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  allChoices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => pickChoice(btn, c === q.a);
    box.appendChild(btn);
  });

  setChar('캐릭-수줍');
}

function getCat(q) {
  for (const [k,v] of Object.entries(DB))
    if (v.some(x => x.q === q.q)) return k;
  return 'all';
}

function pickChoice(btn, isCorrect) {
  if (answered) return;
  answered = true;

  // 모든 버튼 비활성화 + 정답 강조
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === list[idx].a) b.classList.add('correct');
  });

  if (isCorrect) {
    score += 10;
    document.getElementById('scoreTxt').textContent = score;
    const msgs = ['🎉 딩동댕!','⭐ 정답!','👏 맞았어!','🌟 천재인데?','😄 완벽해!'];
    document.getElementById('reaction').textContent = msgs[Math.floor(Math.random()*msgs.length)];
    setChar('캐릭-정답');
    playSound('correct');
    miniConfetti();
  } else {
    btn.classList.add('wrong');
    const msgs = ['😢 아쉬워!','🙈 다시 해봐!','💪 다음엔 맞자!','😅 아깝다~'];
    document.getElementById('reaction').textContent = msgs[Math.floor(Math.random()*msgs.length)];
    setChar('캐릭-슬픔');
    playSound('wrong');
  }

  document.getElementById('btnNextMain').style.display = '';
}

function nextQ() {
  idx++;
  if (idx >= list.length) showResult();
  else render();
}

function showResult() {
  show('s-result');
  const max = list.length * 10, ratio = score / max;
  document.getElementById('resScore').textContent = score;
  document.getElementById('resOf').textContent    = `/ ${max}점`;
  document.getElementById('resSub').textContent   = `${list.length}문제 중 ${Math.round(score/10)}문제 맞힘`;
  let charName, title, msg;
  if      (ratio >= 0.9) { charName='캐릭-우승';   title='수수께끼 천재!';  msg='친구들한테 꼭 내봐!'; }
  else if (ratio >= 0.6) { charName='캐릭-정답';   title='잘했어!';         msg='한 번 더 해볼까?'; }
  else if (ratio >= 0.3) { charName='캐릭-슬픔';   title='괜찮아!';         msg='다시 도전해봐!'; }
  else                   { charName='캐릭-달슬픔'; title='연습이 필요해!';   msg='같이 다시 해보자!'; }
  document.getElementById('resChar').src = charName + '.png';
  document.getElementById('resTitle').textContent = title;
  document.getElementById('resMsg').textContent   = msg;
  if (ratio >= 0.6) confetti();

  // 닉네임 등록창 초기화
  const ns = document.getElementById('nickSection');
  const ni = document.getElementById('nickInput');
  const nb = document.getElementById('btnSubmit');
  ns.style.opacity = '';
  ns.style.pointerEvents = '';
  ni.value = '';
  ni.style.borderColor = '';
  ni.placeholder = '닉네임 (최대 8자)';
  nb.disabled = false;
  nb.textContent = '등록!';
  nb.style.background = '';
}

// ── 효과음 (Web Audio API - 파일 없이 생성) ──
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (type === 'correct') {
      // 밝고 경쾌한 "딩동댕!" 3음
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        const t = ctx.currentTime + i * 0.13;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.5, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        osc.start(t); osc.stop(t + 0.38);
      });
    } else {
      // 내려가는 "부우~" 틀림 소리
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.28, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
    }
  } catch(e) {}
}

// ── 정답 시 미니 폭죽 ──
function miniConfetti() {
  const wrap = document.getElementById('confWrap');
  const cols = ['#ff6b6b','#ffd93d','#6bcb77','#38bdf8','#a78bfa','#f472b6','#fb923c'];
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    p.className = 'cp';
    p.style.cssText = `
      left:${Math.random()*100}vw; top:-12px;
      width:${Math.random()*7+4}px; height:${Math.random()*7+4}px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      animation-delay:${Math.random()*0.6}s;
      animation-duration:${Math.random()*0.8+1}s;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    wrap.appendChild(p);
  }
  setTimeout(() => {
    // 이미 있던 결과화면 폭죽은 건드리지 않도록 개별 제거
    wrap.querySelectorAll('.cp').forEach(el => el.remove());
  }, 2200);
}

function confetti() {
  const wrap = document.getElementById('confWrap');
  wrap.innerHTML = '';
  const cols = ['#ff6b6b','#ffd93d','#6bcb77','#38bdf8','#a78bfa','#f472b6','#fb923c'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'cp';
    p.style.cssText = `
      left:${Math.random()*100}vw; top:-12px;
      width:${Math.random()*8+5}px; height:${Math.random()*8+5}px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      animation-delay:${Math.random()*1.6}s;
      animation-duration:${Math.random()*1+1.4}s;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    wrap.appendChild(p);
  }
  setTimeout(() => wrap.innerHTML = '', 3500);
}

    nickEl.focus();
    nickEl.style.borderColor = '#ef4444';
    nickEl.placeholder = '닉네임을 입력해줘! 😊';
    return;
  }
  nickEl.style.borderColor = '';
  btnEl.disabled = true;
  btnEl.textContent = '등록 중...';

  const scoreVal = parseInt(document.getElementById('resScore').textContent) || 0;
  const ofText   = document.getElementById('resOf').textContent;           // "/ 50점"
  const maxVal   = parseInt(ofText.replace(/[^0-9]/g, '')) || 0;

  try {
    const res = await fetch(`${FB_URL}/scores.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        score: scoreVal,
        maxScore: maxVal,
        date: new Date().toLocaleDateString('ko-KR')
      })
    });
    if (!res.ok) throw new Error('서버 오류');
    btnEl.textContent = '✅ 등록 완료!';
    btnEl.style.background = 'linear-gradient(135deg,#38bdf8,#0ea5e9)';
    document.getElementById('nickSection').style.opacity = '0.65';
    document.getElementById('nickSection').style.pointerEvents = 'none';
  } catch(e) {
    btnEl.disabled = false;
    btnEl.textContent = '다시 시도';
    alert('랭킹 등록에 실패했어 😅\n인터넷 연결을 확인해봐!');
  }
}

async function showRanking() {
  const overlay = document.getElementById('rankOverlay');
  const listEl  = document.getElementById('rankList');
  overlay.classList.add('open');
  listEl.innerHTML = '<div class="rank-loading">🏆</div>';

  try {
    const res  = await fetch(`${FB_URL}/scores.json`);
    const data = await res.json();

    if (!data) {
      listEl.innerHTML = '<div class="rank-empty">아직 기록이 없어!<br>첫 번째 도전자가 되어봐! 🚀</div>';
      return;
    }

    const scores = Object.values(data)
      .filter(s => s && s.name && typeof s.score === 'number')
      .sort((a, b) => b.score - a.score || a.date?.localeCompare(b.date || ''))
      .slice(0, 10);

    if (scores.length === 0) {
      listEl.innerHTML = '<div class="rank-empty">아직 기록이 없어!<br>첫 번째 도전자가 되어봐! 🚀</div>';
      return;
    }

    const medals = ['🥇','🥈','🥉'];
    const topClass = ['top1','top2','top3'];
    listEl.innerHTML = scores.map((s, i) => `
      <div class="rank-item ${topClass[i] || ''}">
        <span class="rank-medal">${medals[i] || ''}</span>
        <span class="rank-num">${medals[i] ? '' : i + 1}</span>
        <span class="rank-name">${escHtml(s.name)}</span>
        <span class="rank-score">${s.score}점</span>
        <span class="rank-date">${s.date || ''}</span>
      </div>
    `).join('');
  } catch(e) {
    listEl.innerHTML = '<div class="rank-empty">랭킹을 불러올 수 없어 😅<br>인터넷 연결을 확인해봐!</div>';
  }
}

function closeRanking() {
  document.getElementById('rankOverlay').classList.remove('open');
}

function closeRankingBg(e) {
  if (e.target === document.getElementById('rankOverlay')) closeRanking();
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

if (localStorage.getItem('mungsilTheme') === 'dark')
  document.documentElement.classList.add('dark');
</script>
