<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S — AI 음성 어시스턴트</title>
  <style>
    :root {
      --primary: #00d4ff;
      --primary-dim: rgba(0,212,255,0.15);
      --primary-glow: rgba(0,212,255,0.35);
      --bg: #060b18;
      --bg-panel: rgba(0,18,38,0.85);
      --border: rgba(0,212,255,0.18);
      --text: #c0e8f8;
      --text-dim: rgba(160,220,240,0.45);
      --user-col: #00d4ff;
      --ai-col: #7fbbcc;
      --radius: 12px;
      --tr: all 0.28s cubic-bezier(.4,0,.2,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 15% 15%, rgba(0,80,180,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(0,180,255,0.06) 0%, transparent 55%);
      color: var(--text);
      font-family: 'Segoe UI','SF Pro Display',system-ui,sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER ── */
    .header {
      width: 100%;
      background: linear-gradient(180deg, rgba(0,25,55,0.95) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 30px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      bottom: 0; left: -100%;
      width: 300%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      animation: scan 4s linear infinite;
    }
    @keyframes scan { to { left: 100%; } }

    .header-logo { line-height: 1; }
    .header-title {
      font-size: 1.35rem;
      font-weight: 300;
      letter-spacing: 10px;
      color: var(--primary);
      text-transform: uppercase;
    }
    .header-sub {
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-top: 5px;
      text-transform: uppercase;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #333;
      transition: var(--tr);
      flex-shrink: 0;
    }
    .status-dot.ready    { background: #00ff80; box-shadow: 0 0 8px #00ff80; }
    .status-dot.listening{ background: var(--primary); box-shadow: 0 0 10px var(--primary); animation: blink 1.2s ease-in-out infinite; }
    .status-dot.thinking { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; animation: blink 0.7s ease-in-out infinite; }
    .status-dot.speaking { background: #ff66bb; box-shadow: 0 0 10px #ff66bb; animation: blink 0.9s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── CONTAINER ── */
    .container {
      width: 100%;
      max-width: 760px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    /* ── SETUP PANEL ── */
    .setup-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: opacity 0.4s;
    }
    .setup-label {
      font-size: 0.7rem;
      letter-spacing: 2.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .setup-row { display: flex; gap: 10px; }

    input.api-input {
      flex: 1;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 9px 14px;
      font-size: 0.88rem;
      font-family: monospace;
      outline: none;
      transition: var(--tr);
    }
    input.api-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }

    .btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 0.82rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: var(--tr);
      white-space: nowrap;
      font-family: inherit;
    }
    .btn:hover { background: rgba(0,212,255,0.1); box-shadow: 0 0 12px rgba(0,212,255,0.2); }
    .btn-solid {
      background: var(--primary);
      color: #060b18;
      font-weight: 700;
    }
    .btn-solid:hover { background: #20e5ff; box-shadow: 0 0 20px rgba(0,212,255,0.45); }
    .btn-dim { border-color: rgba(160,220,240,0.25); color: var(--text-dim); }
    .btn-dim:hover { border-color: var(--primary); color: var(--primary); background: transparent; }

    .setup-note {
      margin-top: 8px;
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    /* ── SETTINGS BAR ── */
    .settings-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .settings-row label {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    select.sel {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
      transition: var(--tr);
      font-family: inherit;
    }
    select.sel:focus { border-color: var(--primary); }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-dim);
      transition: var(--tr);
    }
    .toggle-wrap:hover { color: var(--primary); }
    .toggle-wrap input { accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer; }

    /* ── ERROR ── */
    .error-box {
      background: rgba(255,60,90,0.08);
      border: 1px solid rgba(255,60,90,0.25);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 0.82rem;
      color: #ff6680;
      display: none;
    }
    .error-box.show { display: block; }

    /* ── CONVERSATION ── */
    .conversation {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      min-height: 280px;
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .conversation::-webkit-scrollbar { width: 4px; }
    .conversation::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .conversation::-webkit-scrollbar-track { background: transparent; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .empty-icon { font-size: 2rem; opacity: 0.4; }

    .message {
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: fadeUp 0.3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-role {
      font-size: 0.68rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .message.user   .msg-role { color: var(--user-col); }
    .message.ai     .msg-role { color: var(--ai-col); }
    .msg-text {
      font-size: 0.93rem;
      line-height: 1.65;
      padding: 11px 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user .msg-text {
      background: rgba(0,212,255,0.07);
      border: 1px solid rgba(0,212,255,0.15);
    }
    .message.ai .msg-text {
      background: rgba(127,187,204,0.06);
      border: 1px solid rgba(127,187,204,0.12);
    }

    /* ── TRANSCRIPT ── */
    .transcript {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(0,212,255,0.04);
      border: 1px dashed rgba(0,212,255,0.18);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 0.88rem;
      color: var(--text-dim);
      font-style: italic;
      min-height: 46px;
    }
    .transcript.show { display: flex; }
    .transcript-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
      animation: blink 0.9s ease-in-out infinite;
      flex-shrink: 0;
    }

    /* ── MIC AREA ── */
    .mic-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 14px 0 4px;
    }
    .voice-rings {
      position: relative;
      width: 110px; height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--primary);
      opacity: 0;
    }
    .ring-1 { width: 100%; height: 100%; }
    .ring-2 { width: 135%; height: 135%; }
    .ring-3 { width: 170%; height: 170%; }

    .voice-rings.active .ring { animation: ripple 1.8s ease-out infinite; }
    .voice-rings.active .ring-1 { animation-delay: 0s; }
    .voice-rings.active .ring-2 { animation-delay: 0.35s; }
    .voice-rings.active .ring-3 { animation-delay: 0.7s; }
    @keyframes ripple {
      0%   { opacity: 0.55; transform: scale(0.88); }
      100% { opacity: 0;    transform: scale(1.08); }
    }

    .mic-btn {
      width: 76px; height: 76px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      background: rgba(0,212,255,0.07);
      color: var(--primary);
      font-size: 1.7rem;
      cursor: pointer;
      transition: var(--tr);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .mic-btn:hover:not(:disabled) {
      background: rgba(0,212,255,0.14);
      box-shadow: 0 0 28px rgba(0,212,255,0.35);
      transform: scale(1.06);
    }
    .mic-btn.on {
      background: rgba(0,212,255,0.18);
      box-shadow: 0 0 36px rgba(0,212,255,0.5);
    }
    .mic-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .mic-hint {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
      text-align: center;
    }

    /* ── KEYBOARD HINT ── */
    .kbd-hint {
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-align: center;
      padding-bottom: 10px;
    }
    kbd {
      background: rgba(0,212,255,0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--primary);
    }

    @media (max-width: 420px) {
      .header-title { font-size: 1.1rem; letter-spacing: 6px; }
      .container { padding: 20px 14px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <div class="header-title">J.A.R.V.I.S</div>
    <div class="header-sub">Just A Rather Very Intelligent System</div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">초기화 중</span>
  </div>
</header>

<div class="container">

  <!-- API KEY SETUP -->
  <div class="setup-panel" id="setupPanel">
    <div class="setup-label">Anthropic API Key</div>
    <div class="setup-row">
      <input type="password" class="api-input" id="apiKeyInput"
             placeholder="sk-ant-api03-..." autocomplete="off" />
      <button class="btn btn-solid" onclick="saveKey()">저장</button>
      <button class="btn btn-dim" onclick="clearKey()" title="API 키 삭제">✕</button>
    </div>
    <div class="setup-note">🔒 API 키는 이 브라우저의 로컬스토리지에만 저장됩니다. 서버로 전송되지 않습니다.</div>
  </div>

  <!-- SETTINGS -->
  <div class="settings-row">
    <label>모델</label>
    <select class="sel" id="modelSel">
      <option value="claude-haiku-4-5">Haiku 4.5 — 빠름</option>
      <option value="claude-sonnet-4-6">Sonnet 4.6 — 균형</option>
      <option value="claude-opus-4-7">Opus 4.7 — 최강</option>
    </select>

    <label>언어</label>
    <select class="sel" id="langSel">
      <option value="ko-KR">한국어</option>
      <option value="en-US">English</option>
      <option value="ja-JP">日本語</option>
      <option value="zh-CN">中文</option>
    </select>

    <label class="toggle-wrap">
      <input type="checkbox" id="ttsTgl" checked> 음성 응답
    </label>

    <button class="btn btn-dim" onclick="clearChat()" style="margin-left:auto">대화 초기화</button>
  </div>

  <!-- ERROR -->
  <div class="error-box" id="errorBox"></div>

  <!-- CONVERSATION -->
  <div class="conversation" id="conv">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎙️</div>
      <span>마이크를 눌러 대화를 시작하세요</span>
    </div>
  </div>

  <!-- LIVE TRANSCRIPT -->
  <div class="transcript" id="transcriptBox">
    <div class="transcript-dot"></div>
    <span id="transcriptTxt">듣는 중…</span>
  </div>

  <!-- MIC BUTTON -->
  <div class="mic-area">
    <div class="voice-rings" id="rings">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <button class="mic-btn" id="micBtn" onclick="toggleMic()" disabled
              title="클릭 또는 스페이스바">🎙️</button>
    </div>
    <div class="mic-hint" id="micHint">API 키를 먼저 입력하세요</div>
  </div>

  <div class="kbd-hint"><kbd>Space</kbd> 키로도 마이크를 켜고 끌 수 있습니다</div>

</div>

<script>
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let apiKey = '';
let recognition = null;
let isListening = false;
let isSpeaking = false;
let isThinking = false;
let history = [];   // [{role:'user'|'assistant', content:'...'}]
const MAX_HISTORY = 20; // 최대 20개 메시지 유지

const SYSTEM = `You are J.A.R.V.I.S (Just A Rather Very Intelligent System), the AI assistant.
Be helpful, concise, and intelligent. For voice responses, keep answers brief and conversational
(2–4 sentences unless more detail is explicitly needed). Always respond in the same language
the user speaks. Address the user respectfully. You can assist with any task including
coding, writing, analysis, and general questions.`;

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
function init() {
  // Load saved key
  const saved = localStorage.getItem('jarvis_key') || '';
  if (saved) {
    apiKey = saved;
    maskKeyInput(saved);
    onKeyReady();
  } else {
    setStatus('', '대기 중');
  }

  // Load settings
  const savedModel = localStorage.getItem('jarvis_model');
  if (savedModel) document.getElementById('modelSel').value = savedModel;
  const savedLang = localStorage.getItem('jarvis_lang');
  if (savedLang) document.getElementById('langSel').value = savedLang;
  const savedTts = localStorage.getItem('jarvis_tts');
  if (savedTts !== null) document.getElementById('ttsTgl').checked = savedTts === '1';

  // Save settings on change
  document.getElementById('modelSel').onchange = () =>
    localStorage.setItem('jarvis_model', document.getElementById('modelSel').value);
  document.getElementById('langSel').onchange = () =>
    localStorage.setItem('jarvis_lang', document.getElementById('langSel').value);
  document.getElementById('ttsTgl').onchange = () =>
    localStorage.setItem('jarvis_tts', document.getElementById('ttsTgl').checked ? '1' : '0');

  initSpeech();

  // Keyboard: Space = toggle mic
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      toggleMic();
    }
  });
}

/* ══════════════════════════════════════════
   API KEY
══════════════════════════════════════════ */
function saveKey() {
  const input = document.getElementById('apiKeyInput').value.trim();
  if (!input || input.includes('•')) { showError('유효한 API 키를 입력해주세요.'); return; }
  if (!input.startsWith('sk-ant-')) {
    showError('Anthropic API 키는 "sk-ant-" 로 시작해야 합니다.'); return;
  }
  apiKey = input;
  localStorage.setItem('jarvis_key', apiKey);
  maskKeyInput(apiKey);
  hideError();
  onKeyReady();
}

function clearKey() {
  apiKey = '';
  localStorage.removeItem('jarvis_key');
  document.getElementById('apiKeyInput').value = '';
  document.getElementById('micBtn').disabled = true;
  document.getElementById('micHint').textContent = 'API 키를 먼저 입력하세요';
  document.getElementById('setupPanel').style.opacity = '1';
  setStatus('', '대기 중');
}

function maskKeyInput(key) {
  document.getElementById('apiKeyInput').value = '••••••••••••••••' + key.slice(-4);
  document.getElementById('setupPanel').style.opacity = '0.55';
}

function onKeyReady() {
  document.getElementById('micBtn').disabled = false;
  document.getElementById('micHint').textContent = '클릭하여 말하기 시작 (Space)';
  setStatus('ready', '준비');
}

/* ══════════════════════════════════════════
   SPEECH RECOGNITION
══════════════════════════════════════════ */
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showError('⚠️ 이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge를 사용하세요.');
    return;
  }

  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    setStatus('listening', '듣는 중…');
    document.getElementById('rings').classList.add('active');
    document.getElementById('micBtn').classList.add('on');
    document.getElementById('micBtn').textContent = '⏹️';
    document.getElementById('micHint').textContent = '말씀하세요… 다시 클릭하면 중지';
    showTranscript('듣는 중…');
  };

  recognition.onresult = e => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? (final += t) : (interim += t);
    }
    showTranscript(final || interim || '…');
    if (final.trim()) {
      stopListening();
      askClaude(final.trim());
    }
  };

  recognition.onerror = e => {
    stopListening();
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      showError(`음성 인식 오류: ${e.error}`);
    }
  };

  recognition.onend = () => { if (isListening) stopListening(); };
}

function toggleMic() {
  if (!apiKey) { showError('API 키를 먼저 저장해주세요.'); return; }
  if (isThinking) return;
  if (isSpeaking) stopSpeech();
  isListening ? stopListening() : startListening();
}

function startListening() {
  if (!recognition) return;
  hideError();
  recognition.lang = document.getElementById('langSel').value;
  try { recognition.start(); } catch(e) {
    // re-init if already started
    initSpeech();
    setTimeout(() => recognition && recognition.start(), 100);
  }
}

function stopListening() {
  isListening = false;
  try { recognition && recognition.stop(); } catch(e) {}
  document.getElementById('rings').classList.remove('active');
  document.getElementById('micBtn').classList.remove('on');
  document.getElementById('micBtn').textContent = '🎙️';
  document.getElementById('micHint').textContent = '클릭하여 말하기 시작 (Space)';
  hideTranscript();
}

/* ══════════════════════════════════════════
   CLAUDE API
══════════════════════════════════════════ */
async function askClaude(userText) {
  history.push({ role: 'user', content: userText });
  if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);

  addMsg('user', userText);
  setStatus('thinking', '생각 중…');
  isThinking = true;
  document.getElementById('micBtn').disabled = true;

  const model = document.getElementById('modelSel').value;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-calls': 'true'
      },
      body: JSON.stringify({
        model,
        max_tokens: 1024,
        system: SYSTEM,
        messages: history
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API 오류 (${res.status})`);
    }

    const data = await res.json();
    const aiText = data.content?.[0]?.text || '(응답 없음)';

    history.push({ role: 'assistant', content: aiText });
    if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);

    addMsg('ai', aiText);

    if (document.getElementById('ttsTgl').checked) {
      await speakText(aiText);
    } else {
      setStatus('ready', '준비');
    }

  } catch (err) {
    showError(err.message);
    history.pop(); // 실패한 user 메시지 제거
    setStatus('ready', '준비');
  } finally {
    isThinking = false;
    document.getElementById('micBtn').disabled = false;
  }
}

/* ══════════════════════════════════════════
   TTS
══════════════════════════════════════════ */
function speakText(text) {
  return new Promise(resolve => {
    stopSpeech();
    setStatus('speaking', '말하는 중…');
    isSpeaking = true;

    // 마크다운 제거
    const clean = text
      .replace(/```[\s\S]*?```/g, '코드 생략.')
      .replace(/`[^`]+`/g, match => match.slice(1,-1))
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\*(.*?)\*/g, '$1')
      .replace(/#{1,6}\s+/g, '')
      .replace(/\n{2,}/g, '. ')
      .replace(/\n/g, ' ')
      .trim();

    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = document.getElementById('langSel').value;
    utter.rate = 1.05;
    utter.pitch = 1.0;

    // 한국어 음성 선택
    const voices = speechSynthesis.getVoices();
    const langCode = utter.lang.split('-')[0];
    const preferred = voices.find(v => v.lang === utter.lang && v.localService)
                   || voices.find(v => v.lang.startsWith(langCode) && v.localService)
                   || voices.find(v => v.lang === utter.lang)
                   || voices.find(v => v.lang.startsWith(langCode));
    if (preferred) utter.voice = preferred;

    utter.onend = () => { isSpeaking = false; setStatus('ready', '준비'); resolve(); };
    utter.onerror = () => { isSpeaking = false; setStatus('ready', '준비'); resolve(); };

    speechSynthesis.speak(utter);
  });
}

function stopSpeech() {
  if (isSpeaking) { speechSynthesis.cancel(); isSpeaking = false; }
}

// 음성 목록 로딩 대기
speechSynthesis.onvoiceschanged = () => {};

/* ══════════════════════════════════════════
   UI HELPERS
══════════════════════════════════════════ */
function addMsg(role, text) {
  const conv = document.getElementById('conv');
  document.getElementById('emptyState')?.remove();

  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `
    <div class="msg-role">${role === 'user' ? '[ YOU ]' : '[ JARVIS ]'}</div>
    <div class="msg-text">${esc(text)}</div>`;
  conv.appendChild(div);
  conv.scrollTop = conv.scrollHeight;
}

function clearChat() {
  history = [];
  document.getElementById('conv').innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎙️</div>
      <span>마이크를 눌러 대화를 시작하세요</span>
    </div>`;
  stopSpeech();
}

function setStatus(cls, text) {
  document.getElementById('statusDot').className = 'status-dot ' + cls;
  document.getElementById('statusText').textContent = text;
}

function showTranscript(t) {
  document.getElementById('transcriptTxt').textContent = t;
  document.getElementById('transcriptBox').classList.add('show');
}
function hideTranscript() {
  document.getElementById('transcriptBox').classList.remove('show');
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}

function esc(s) {
  return s
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');
}

/* ══════════════════════════════════════════
   START
══════════════════════════════════════════ */
init();
</script>
